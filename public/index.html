<!--
 CITY COLLEGE OF DAVAO - FACULTY EVALUATION FORM (single-file source code)
 HOW TO EDIT (search for these keywords):
  - Colors ........ the CSS variables at the top of the style block (--ac = green, --gd = gold, --card = white)
  - Logo .......... "const LOGO" in the script (a base64 PNG; replace the string to change it)
  - Questionnaire . the "Q" array (categories and statements); rating words are in dsc()
  - Admin password  set on first run (default admin123); change it in the Settings tab
  - Data .......... stored by the server in PostgreSQL (see server.js); this page talks to it through api()
  - Sections ...... student, admin, reports (see the /* ---------- ... ---------- */ comments)
-->

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f8f3;--card:#fff;--tx:#14301f;--mu:#5a6f62;--bd:#d6e4da;--ac:#0b6b3a;--ac2:#e5f3ea;--gd:#d9a514;--gd2:#fdf4d8;--gdt:#7a5700;--on:#fff;--ok:#157347;--okb:#e3f5ea;--er:#b42318;--erb:#fdeceb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1710;--card:#13241a;--tx:#e8f2eb;--mu:#9bb3a3;--bd:#27402f;--ac:#2f9e62;--ac2:#1b3a28;--gd:#e8bf4a;--gd2:#33290c;--gdt:#e8bf4a;--ok:#6fd49a;--okb:#16301f;--er:#ff9a90;--erb:#3a1c1a}}
:root[data-theme="dark"]{--bg:#0b1710;--card:#13241a;--tx:#e8f2eb;--mu:#9bb3a3;--bd:#27402f;--ac:#2f9e62;--ac2:#1b3a28;--gd:#e8bf4a;--gd2:#33290c;--gdt:#e8bf4a;--ok:#6fd49a;--okb:#16301f;--er:#ff9a90;--erb:#3a1c1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:940px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--ac),#064a28);color:#fff;border-radius:14px;border-bottom:5px solid var(--gd);padding:14px 16px}
.hd img{width:68px;height:68px;flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}.hd h1{margin:0;font-size:21px;line-height:1.25;color:#fff}.hd div div{color:#f3d572;font-size:13px;margin-top:2px}
h2{margin:0 0 6px;font-size:19px;color:var(--ac)}h3{margin:0 0 8px;font-size:16px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}.card,.blk{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gd);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row input{flex:1;min-width:140px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;margin:6px 0}label{display:block;font-size:13px;color:var(--mu);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.g2{grid-template-columns:1fr}.hd h1{font-size:17px}.hd img{width:52px;height:52px}}
button,.fb{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--ac)}
.b1{background:var(--ac);color:var(--on)}.b2,.fb{background:transparent;color:var(--ac)}.fb{display:inline-block;font-size:15px}button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:var(--card);color:var(--tx);border-color:var(--bd)}.tabs .on{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 3px 0 var(--gd)}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}.ok{background:var(--okb);color:var(--ok)}.er{background:var(--erb);color:var(--er)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--gd2);color:var(--gdt);border-radius:99px;padding:3px 10px;font-size:13px}.chip.ok{background:var(--okb);color:var(--ok)}.chip a{cursor:pointer;color:var(--er);margin-left:4px}
.cat{font-weight:700;margin:14px 0 4px;color:var(--gdt);border-bottom:2px solid var(--gd)}.it{padding:10px 0;border-top:1px solid var(--bd)}.it.bad{background:var(--erb)}
.rs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.rt input{position:absolute;opacity:0}.rt span{display:inline-block;min-width:42px;text-align:center;padding:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.rt input:checked+span{background:var(--ac);color:var(--on);border-color:var(--gd);box-shadow:0 0 0 2px var(--gd)}.rt input:focus-visible+span{outline:2px solid var(--gd)}
.scale{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--ac);color:var(--on)}td:nth-child(n+2){text-align:center;white-space:nowrap}.ch td{background:var(--gd2);font-weight:700}.it2{padding-left:18px}
.sc{overflow-x:auto}.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px}.lg2{width:54px;height:54px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gd));border-radius:3px}
.note{font-size:12px;font-style:italic;color:var(--mu);margin:8px 0 0;text-align:justify}.disc{font-size:12.5px;color:var(--gdt);background:var(--gd2);border-left:3px solid var(--gd);padding:8px 10px;border-radius:6px;margin:10px 0}
.sig{display:flex;justify-content:space-between;gap:48px;margin-top:36px;break-inside:avoid}.sg{width:46%}.nm{border-bottom:1.5px solid var(--tx);text-align:center;font-weight:700;text-transform:uppercase;margin-top:38px;padding-bottom:2px;min-height:1.2em}.tt{text-align:center;font-size:13px}
@page{size:8.5in 13in;margin:12mm}

const Q=[
{t:"Commitment",i:["Effectively demonstrates sensitivity to students' varying abilities to comprehend content information.","Answers questions or provides help outside of regular class hours (e.g., during breaks or through messages/email).","Regularly comes to class on time, well-groomed, and well-prepared to complete assigned responsibilities.","Keeps accurate records of student performance and promptly submits them."]},
{t:"Knowledge of the Subject",i:["Demonstrates mastery of the subject matter (explains the subject matter without relying solely on the prescribed textbook).","Draws and shares information on the state of the art of theory and practice in their discipline.","Integrates the subject into practical circumstances and learning intents/purposes of students.","Connects the topic to real-life situations or past lessons to help us understand its importance.","Shares updated and relevant information related to the subject (e.g., new trends, news, or issues)."]},
{t:"Teaching for Independent Learning",i:["Gives activities that help students practice and apply what they are learning.","Gives praise or encouragement when students do well or show improvement.","Allows students to create their own course objectives and realistically defined student-professor rules, making them accountable for their performance.","Encourages students to think independently and make their own decisions, holding them accountable for their performance based on their success in executing decisions.","Encourages students to go beyond the lesson by exploring how to use what we learn in real-life situations."]},
{t:"Management of Learning",i:["Creates opportunities for intensive and/or extensive contribution of students in class activities (e.g., breaks class into dyads, triads, or buzz/task groups).","Helps students understand the lesson by asking questions or giving examples.","Creates an environment where students can share ideas or ask questions freely.","Adjusts the lesson (activities, group work, strategies) so students can understand the topic better as a class.","Uses helpful materials or activities (e.g., videos, group activities, presentations, or technology) to support our learning."]}];

async function api(m,u,b){const r=await fetch("/api"+u,{method:m,headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){if(r.status==401&&TOK){TOK="";sessionStorage.removeItem("fe_tok");S.v="login";S.m="admin";render()}throw Object.assign(new Error(j.error||"Could not reach the server."),{status:r.status})}return j}
const reload=async()=>{D=await api("GET","/admin/data")};
async function mut(m,u,b,fn){try{const j=await api(m,u,b);await reload();if(fn)fn(j);render()}catch(e){alert(e.message)}}
async function bak(){try{const d=await api("GET","/admin/data"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}));a.download="faculty-evaluation-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}catch(e){alert(e.message)}}
async function go(t){S.tab=t;try{await reload()}catch(e){}render()}
const dsc=x=>x>=4.5?"Outstanding":x>=3.5?"Very Satisfactory":x>=2.5?"Satisfactory":x>=1.5?"Fair":"Poor";
const mean=L=>L.length?L.reduce((a,e)=>a+e.r.reduce((p,q)=>p+q,0)/N,0)/L.length:0;
const tn=id=>(D.teachers.find(t=>t.id==id)||{name:"(removed teacher)"}).name;

function render(){const a=$("app");
 if(S.v=="login"){a.innerHTML=`<div class="card" style="max-width:420px;margin:24px auto"><div class="tabs"><button class="${S.m=="student"?"on":""}" onclick="S.m='student';render()">Student</button><button class="${S.m=="admin"?"on":""}" onclick="S.m='admin';render()">Admin</button></div>
 <div id="le"></div><label>${S.m=="student"?"Student ID No.":"Admin password"}<input id="li" ${S.m=="admin"?'type="password"':''} onkeydown="if(event.key=='Enter')login()" autofocus></label><br><button class="b1" style="width:100%" onclick="login()">${S.m=="student"?"Start Evaluation":"Log in"}</button>${S.m=="admin"?'':'<p class="disc">Disclaimer: This evaluation form collects your student ID number solely for faculty evaluation.</p>'}</div>`;return}
 if(S.v=="student"){a.innerHTML=`<div class="card row"><b>Student ID No.: ${esc(S.sid)}</b><button class="b2" onclick="logout()">Log out</button></div><div id="ev"></div>`;buildForm();return}
 const T=[["students","Students"],["teachers","Teachers & Subjects"],["search","Search"],["reports","Reports"],["ranking","🏆 Ranking"],["settings","Settings"]];
 a.innerHTML=`<div class="np"><div class="row"><b>Administrator</b><button class="b2" onclick="logout()">Log out</button></div><div class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div></div><div id="tb"></div>`;
 ({students:tStu,teachers:tTea,search:tSea,reports:tRep,ranking:tRank,settings:tSet})[S.tab]()}
async function login(){const v=$("li").value.trim(),e=$("le");
 try{if(S.m=="student"){const j=await api("POST","/student/login",{id:v});S.sid=j.id;D={students:[],teachers:j.teachers,evals:j.done.map(x=>({sid:j.id,tid:x[0],s:x[1]}))};S.v="student"}
 else{const j=await api("POST","/admin/login",{password:v});TOK=j.token;sessionStorage.setItem("fe_tok",TOK);await reload();S.v="admin"}render()}
 catch(x){e.innerHTML=msg("er",x.message)}}
function logout(){S.v="login";S.sid=null;TOK="";sessionStorage.removeItem("fe_tok");D={students:[],teachers:[],evals:[]};render()}

/* ---------- student ---------- */
const done=(t,s)=>D.evals.some(e=>e.sid==S.sid&&e.tid==t.id&&e.s==s);
function buildForm(){let k=0;const ev=$("ev");
 if(!D.teachers.length){ev.innerHTML=msg("er","No teachers are available yet. Please contact the administrator.");return}
 ev.innerHTML=`<div class="card"><h2>Teacher Evaluation Form</h2><p class="disc">Disclaimer: This evaluation form collects your student ID number solely for faculty evaluation.</p><p class="mu">Thank you for your feedback. Rate each statement honestly and objectively from your own experience. Comments are optional. Your responses are confidential and used only for evaluation purposes.</p>
 <p class="scale"><b>Rating scale:</b> 1 – Poor · 2 – Fair · 3 – Satisfactory · 4 – Very Satisfactory · 5 – Outstanding</p>
 <div class="g2"><label>Teacher<select id="tsel" onchange="onT()">${D.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Subject<select id="ssel" onchange="chk()"></select></label></div><div id="note"></div></div>
 <div class="card" id="qs">${Q.map((c,ci)=>`<div class="cat">${"ABCD"[ci]}. ${c.t}</div>`+c.i.map(x=>{const n=k++;return`<div class="it" id="it${n}"><div>${n+1}. ${esc(x)}</div><div class="rs">${[1,2,3,4,5].map(v=>`<label class="rt"><input type="radio" name="r${n}" value="${v}"><span>${v}</span></label>`).join("")}</div></div>`}).join("")).join("")}
 <div class="cat">E. Comments</div><label>Optional – if no comments, leave blank<textarea id="cm"></textarea></label><div id="err"></div><button class="b1" id="sb" onclick="submitEv()">Submit Evaluation</button></div>`;onT()}
function onT(){const t=D.teachers.find(x=>x.id==$("tsel").value);$("ssel").innerHTML=t.subjects.length?t.subjects.map(s=>`<option>${esc(s)}</option>`).join(""):'<option value="">(no subjects)</option>';chk()}
function chk(){const t=D.teachers.find(x=>x.id==$("tsel").value),s=$("ssel").value,d=t&&s&&done(t,s);
 $("note").innerHTML=d?msg("ok",`Student ID No. <b>${esc(S.sid)}</b> already done evaluating <b>${esc(t.name)}</b> in <b>${esc(s)}</b>.`):"";$("sb").disabled=!!d;$("err").innerHTML=""}
async function submitEv(){const t=D.teachers.find(x=>x.id==$("tsel").value),s=$("ssel").value,er=$("err");
 if(!t||!s){er.innerHTML=msg("er","Please select a teacher who has a subject.");return}
 if(done(t,s)){chk();return}
 const r=[];for(let k=0;k<N;k++){const el=document.querySelector(`input[name=r${k}]:checked`);if(!el){document.querySelectorAll(".it").forEach(x=>x.classList.remove("bad"));$("it"+k).classList.add("bad");$("it"+k).scrollIntoView({block:"center"});er.innerHTML=msg("er",`Please rate all statements (item ${k+1} is missing).`);return}r.push(+el.value)}
 $("sb").disabled=true;
 try{await api("POST","/student/evaluate",{id:S.sid,tid:t.id,subject:s,ratings:r,comment:$("cm").value.trim()||"None"})}catch(e){$("sb").disabled=false;if(e.status==409){D.evals.push({sid:S.sid,tid:t.id,s});chk();return}er.innerHTML=msg("er",e.message);return}
 D.evals.push({sid:S.sid,tid:t.id,s});
 $("ev").innerHTML=`<div class="card">${msg("ok",`Student ID No. <b>${esc(S.sid)}</b> already done evaluating <b>${esc(t.name)}</b> in <b>${esc(s)}</b>.`)}<p>Thank you for your feedback!</p><button class="b1" onclick="buildForm()">Evaluate another teacher / subject</button></div>`;window.scrollTo(0,0)}

/* ---- import helpers ---- */
function parseCSV(t){const R=[];let r=[],c="",q=false;const d=t.includes("\t")?"\t":",";
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);R.push(r);r=[];c=""}else c+=ch}
 r.push(c);R.push(r);return R.map(x=>x.map(y=>y.trim())).filter(x=>x.some(Boolean))}
function impF(el,fn){const f=el.files[0];el.value="";if(!f)return;const x=/\.xlsx?$/i.test(f.name),fr=new FileReader();
 fr.onload=()=>{try{if(x){if(!window.XLSX)throw 0;const w=XLSX.read(fr.result,{type:"array"});fn(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:false}).map(r=>r.map(v=>String(v==null?"":v).trim())).filter(r=>r.some(Boolean)))}else fn(parseCSV(fr.result))}catch(e){alert("Could not read the file. Please use .csv, .txt or .xlsx.")}};
 x?fr.readAsArrayBuffer(f):fr.readAsText(f)}
function impS(rows){if(rows.length&&/^(student|school|id|no)/i.test(rows[0][0]))rows.shift();mut("POST","/admin/students",{ids:rows.map(r=>r[0]).filter(Boolean)},j=>S.imp=`Imported ${j.added} student ID(s). ${j.skipped} duplicate(s) skipped.`)}
function impT(rows){if(rows.length&&/^(teacher|faculty|name|instructor)/i.test(rows[0][0]))rows.shift();mut("POST","/admin/import-faculty",{rows:rows.map(r=>[r[0],r.slice(1).filter(Boolean).join(", ")])},j=>S.imp=`Imported ${j.teachers} new faculty and ${j.subjects} subject(s).`)}
function addS(v){mut("POST","/admin/students",{ids:v.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean)})}
function delS(i){mut("DELETE","/admin/students/"+encodeURIComponent(D.students[i]))}
function tTea(){$("tb").innerHTML=flash()+`<div class="card"><h3>Import Faculty &amp; Subjects</h3><p class="mu">One subject per row, two columns: <b>Teacher name, Subject</b>. Repeat the teacher's name for each of their subjects. A header row is skipped; existing teachers and subjects are not duplicated.</p>${fbtn("impT")}<textarea id="ft" placeholder="Or paste a list here, e.g.&#10;Juan Dela Cruz, IT 101 - Introduction to Computing&#10;Juan Dela Cruz, IT 102 - Programming 1&#10;Maria Santos, GE 1 - Understanding the Self"></textarea><button class="b2" onclick="impT(parseCSV($('ft').value))">Import pasted list</button></div>
 <div class="card"><h3>Add Teacher</h3><div class="row"><input id="nt" placeholder="Teacher full name"><button class="b1" onclick="addT()">Add</button></div></div>`+
 D.teachers.map((t,i)=>`<div class="card"><div class="row"><b>${esc(t.name)}</b><button class="b2" onclick="delT(${i})">Remove teacher</button></div><div class="chips">${t.subjects.map((s,j)=>`<span class="chip">${esc(s)}<a onclick="delSub(${i},${j})">✕</a></span>`).join("")||'<span class="mu">No subjects yet.</span>'}</div><div class="row"><input id="sj${i}" placeholder="Subject code & name"><button class="b1" onclick="addSub(${i})">Add subject</button></div></div>`).join("")}
function addT(){const v=$("nt").value.trim();if(v)mut("POST","/admin/teachers",{name:v})}
function delT(i){if(confirm("Remove this teacher? Past evaluations are kept in the database."))mut("DELETE","/admin/teachers/"+D.teachers[i].id)}
function addSub(i){const v=$("sj"+i).value.trim();if(v)mut("POST","/admin/teachers/"+D.teachers[i].id+"/subjects",{name:v})}
function delSub(i,j){mut("POST","/admin/teachers/"+D.teachers[i].id+"/subjects/delete",{name:D.teachers[i].subjects[j]})}
function tSet(){$("tb").innerHTML=`<div class="card"><h3>Admin Password</h3><div class="row"><input id="np" type="password" placeholder="New password (min. 6 characters)"><button class="b1" onclick="if($('np').value.length>=6)mut('POST','/admin/password',{password:$('np').value},()=>alert('Password changed.'))">Change</button></div></div>
 <div class="card"><h3>Backup</h3><p class="mu">Downloads all students, teachers, subjects and evaluations as one file. Do this regularly.</p><button class="b1" onclick="bak()">⬇ Download backup (JSON)</button></div>
 <div class="card"><h3>Reset Evaluations</h3><p class="mu">Deletes all submitted evaluations (students, teachers and subjects are kept).</p><button class="b2" onclick="if(confirm('Delete ALL evaluation results?'))mut('DELETE','/admin/evaluations')">Delete all results</button></div>`}
/* ---------- reports ---------- */
const cells=L=>`<td>${L.length}</td><td>${L.length?mean(L).toFixed(5):"–"}</td><td>${L.length?dsc(mean(L)):"–"}</td>`;
const tbl=(h,c1,rows)=>`<div class="card"><h3>${h}</h3><div class="sc"><table><tr>${c1}<th>Respondents</th><th>Mean</th><th>Rating</th></tr>${rows.join("")||'<tr><td colspan="9">No data</td></tr>'}</table></div></div>`;
function tRep(){S.fn="Faculty-Evaluation-Summary";S.land=false;const a=[],b=[],c=[],ss=[...new Set([...D.teachers.flatMap(t=>t.subjects),...D.evals.map(e=>e.s)])];
 D.teachers.forEach(t=>{[...new Set([...t.subjects,...D.evals.filter(e=>e.tid==t.id).map(e=>e.s)])].forEach(x=>a.push(`<tr><td>${esc(t.name)}</td><td>${esc(x)}</td>${cells(D.evals.filter(e=>e.tid==t.id&&e.s==x))}</tr>`));b.push(`<tr><td>${esc(t.name)}</td>${cells(D.evals.filter(e=>e.tid==t.id))}</tr>`)});
 ss.forEach(x=>c.push(`<tr><td>${esc(x)}</td>${cells(D.evals.filter(e=>e.s==x))}</tr>`));
 $("tb").innerHTML=`<div class="card np"><h3>Generate Report</h3><div class="g2"><label>Teacher<select id="rt" onchange="rSub()">${D.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label><label>Subject<select id="rs"></select></label></div><br><button class="b1" onclick="gen()">Generate</button> <button class="b2" onclick="sumAll()">Summary – all faculty</button> <button class="b2" onclick="window.print()">🖨 Print report</button> <button class="b1" onclick="pdf($('rep'),S.fn,S.land)">⬇ Download PDF</button></div>
 <div id="rep">${tbl("Summary per teacher &amp; subject","<th>Teacher</th><th>Subject</th>",a)}${tbl("Overall result per teacher (all subjects combined)","<th>Teacher</th>",b)}${tbl("Overall result per subject (all teachers combined)","<th>Subject</th>",c)}${tbl("Overall result of all evaluations","<th>Scope</th>",[`<tr><td>All teachers &amp; subjects</td>${cells(D.evals)}</tr>`])}</div>`;if(D.teachers.length)rSub()}
const stuDone=(sid,t)=>!!t.subjects.length&&t.subjects.every(x=>D.evals.some(e=>e.sid==sid&&e.tid==t.id&&e.s==x));
function tSea(){$("tb").innerHTML=`<div class="card"><h3>Search Student</h3><input id="qs1" placeholder="Student ID No. (leave blank to list all)" oninput="seaS()"><div id="rs1"></div></div><div class="card"><h3>Search Faculty</h3><input id="qs2" placeholder="Teacher name (leave blank to list all)" oninput="seaF()"><div id="rs2"></div></div>`;seaS();seaF()}
function seaS(){const q=$("qs1").value.trim().toLowerCase(),T=D.teachers.filter(t=>t.subjects.length),L=D.students.filter(x=>x.toLowerCase().includes(q));
 $("rs1").innerHTML=(L.slice(0,30).map(x=>{const c=T.filter(t=>stuDone(x,t)).length;return`<div class="blk"><div class="row"><b>${esc(x)}</b><span class="chip ${T.length&&c==T.length?"ok":""}">${c}/${T.length} faculty evaluated</span></div><div class="mu">${T.map(t=>{const d=t.subjects.filter(y=>D.evals.some(e=>e.sid==x&&e.tid==t.id&&e.s==y)).length;return`${d==t.subjects.length?"✅":d?"🟡":"⬜"} ${esc(t.name)} (${d}/${t.subjects.length} subjects)`}).join("<br>")||"No teachers with subjects yet."}</div></div>`}).join("")||'<p class="mu">No matching student.</p>')+(L.length>30?`<p class="mu">Showing 30 of ${L.length}. Type more to narrow the search.</p>`:"")}
function seaF(){const q=$("qs2").value.trim().toLowerCase(),n=D.students.length,L=D.teachers.filter(t=>t.name.toLowerCase().includes(q));
 $("rs2").innerHTML=L.map(t=>{const c=D.students.filter(x=>stuDone(x,t)).length;return`<div class="blk"><div class="row"><b>${esc(t.name)}</b><span class="chip ${n&&t.subjects.length&&c==n?"ok":""}">${c}/${n} students evaluated</span></div><div class="mu">${t.subjects.map(y=>`${esc(y)}: ${D.students.filter(x=>D.evals.some(e=>e.sid==x&&e.tid==t.id&&e.s==y)).length}/${n} students`).join("<br>")||"No subjects assigned"}</div></div>`}).join("")||'<p class="mu">No matching faculty.</p>'}
function sumAll(){const T=D.teachers,A=T.map(t=>{const L=D.evals.filter(e=>e.tid==t.id),n=L.length,a=Array(N).fill(0);L.forEach(e=>e.r.forEach((v,k)=>a[k]+=v/n));return{n,a}}),av=(x,i,j)=>x.a.slice(i,j).reduce((p,q)=>p+q,0)/(j-i);let k=0,rows="";
 Q.forEach((c,ci)=>{const st=k;k+=c.i.length;rows+=`<tr class="ch"><td>${"ABCD"[ci]}. ${c.t}</td>${A.map(x=>`<td>${x.n?av(x,st,k).toFixed(5):"–"}</td>`).join("")}</tr>`;c.i.forEach((q,i)=>rows+=`<tr><td class="it2">${st+i+1}. ${esc(q)}</td>${A.map(x=>`<td>${x.n?x.a[st+i].toFixed(5):"–"}</td>`).join("")}</tr>`)});
 rows+=`<tr class="ch"><td>OVERALL (all subjects combined)</td>${A.map(x=>`<td>${x.n?av(x,0,N).toFixed(5):"–"}</td>`).join("")}</tr><tr><td>Rating</td>${A.map(x=>`<td>${x.n?dsc(av(x,0,N)):"–"}</td>`).join("")}</tr><tr><td>Total evaluations</td>${A.map(x=>`<td>${x.n}</td>`).join("")}</tr>`;
 $("rep").innerHTML=`<div class="blk"><div class="ph"><img class="lg2" src="${LOGO}" alt=""><div><b>City College of Davao</b><br>Faculty Evaluation Form</div></div><h2>Combined Summary per Faculty – All Subjects Evaluated</h2><p class="mu">Date generated: ${new Date().toLocaleDateString()} · Mean of every evaluation of the faculty across all subjects.</p><div class="sc"><table><tr><th>Questionnaire</th>${T.map(t=>`<th>${esc(t.name)}</th>`).join("")}</tr>${rows}</table></div></div>`;S.fn="Faculty-Summary-All-Faculty";S.land=T.length>3}
function rankData(){return D.teachers.map(t=>{const L=D.evals.filter(e=>e.tid==t.id);return{t,n:L.length,m:mean(L),ns:new Set(L.map(e=>e.s)).size}}).filter(x=>x.n).sort((a,b)=>b.m-a.m)}
const sig=f=>`<div class="sig"><div class="sg"><div>Prepared by:</div><div class="nm">JUDE DIVINE Y. BATILO</div><div class="tt">HR Staff</div></div><div class="sg"><div>Conforme:</div><div class="nm">${f?esc(f):""}</div><div class="tt">Faculty</div></div></div>`;
const lastN=n=>{n=n.trim();if(n.includes(","))return n.split(",")[0].trim();const w=n.replace(/[\s,]+(jr|sr|ii|iii|iv)\.?$/i,"").trim().split(/\s+/);return w[w.length-1]||n};
async function pdf(el,name,land){
 if(!window.html2pdf){alert("The PDF tool could not load (internet connection needed). Please use Print and choose 'Save as PDF'.");return}
 const c=el.cloneNode(true);c.querySelectorAll(".np").forEach(x=>x.remove());c.querySelectorAll(".sc").forEach(x=>x.style.overflow="visible");
 c.style.cssText="--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#999;--ac:#0b6b3a;--ac2:#e5f3ea;--gd:#d9a514;--gd2:#fdf4d8;--gdt:#7a5700;--on:#fff;--ok:#000;--okb:#fff;background:#fff;color:#000;box-sizing:border-box;padding:6px;width:"+(land?1040:730)+"px";
 const w=html2pdf().set({margin:[10,8,10,8],filename:name+".pdf",image:{type:"jpeg",quality:.95},html2canvas:{scale:2,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:[215.9,330.2],orientation:land?"landscape":"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".sig"]}}).from(c);
 try{const d=window.claude?await claude.use("downloads"):null;if(d)await d.save({filename:name+".pdf",data:await w.outputPdf("blob")});else await w.save()}
 catch(e){if(!e||e.code!="declined")alert("Could not create the PDF. Please use Print and choose 'Save as PDF'.")}}
function tRank(){const R=rankData(),sm=S.rs||"desc";let rk=0,pv="";R.forEach((x,i)=>{const f=x.m.toFixed(5);if(f!==pv){rk=i+1;pv=f}x.rk=rk});
 if(sm=="asc")R.reverse();else if(sm=="alpha")R.sort((a,b)=>lastN(a.t.name).localeCompare(lastN(b.t.name),undefined,{sensitivity:"base"})||a.t.name.localeCompare(b.t.name));
 const rows=R.map(x=>`<tr><td><b>${["🥇","🥈","🥉"][x.rk-1]||""} ${x.rk}</b></td><td>${esc(x.t.name)}</td><td>${x.ns}</td><td>${x.n}</td><td><b>${x.m.toFixed(5)}</b><div class="bar"><i style="width:${x.m/5*100}%"></i></div></td><td>${dsc(x.m)}</td></tr>`).join(""),un=D.teachers.length-R.length,o=(v,l)=>`<option value="${v}" ${sm==v?"selected":""}>${l}</option>`;
 $("tb").innerHTML=`<div class="card" id="rk"><div class="ph"><img class="lg2" src="${LOGO}" alt=""><div><b>City College of Davao</b><br>Faculty Ranking – Overall Combined Result</div></div><div class="row np"><label style="min-width:240px">Sort by<select onchange="S.rs=this.value;tRank()">${o("desc","Highest to lowest (descending)")}${o("asc","Lowest to highest (ascending)")}${o("alpha","Alphabetical (by last name)")}</select></label><div><button class="b1" onclick="pdf($('rk'),'Faculty-Ranking')">⬇ Download PDF</button> <button class="b2" onclick="window.print()">🖨 Print</button></div></div><p class="mu np">● Live – updates automatically when evaluations are submitted · last update ${new Date().toLocaleTimeString()}</p><div class="sc"><table><tr><th>Rank</th><th>Faculty</th><th>Subjects evaluated</th><th>Evaluations</th><th>Overall mean</th><th>Rating</th></tr>${rows||'<tr><td colspan="6">No evaluations yet.</td></tr>'}</table></div>${un>0?`<p class="mu">${un} faculty not yet evaluated (not ranked).</p>`:""}<p class="mu">Rank is based on the overall combined mean; sorting only changes the order shown.</p></div>`}
async function sync(){if(S.v=="admin"&&S.tab=="ranking"&&TOK){try{await reload();tRank()}catch(e){}}}
setInterval(sync,4000);
function rSub(){const t=D.teachers.find(x=>x.id==$("rt").value);$("rs").innerHTML='<option value="*">All subjects (general report)</option>'+t.subjects.map(s=>`<option>${esc(s)}</option>`).join("")}
function block(s,L,ti,sg){const n=L.length;if(!n)return`<div class="blk"><h3>${ti||esc(s)}</h3><p class="mu">No evaluations submitted yet.</p></div>`;
 const a=Array(N).fill(0);L.forEach(e=>e.r.forEach((v,k)=>a[k]+=v/n));let k=0,rows="",tot=0;
 Q.forEach((c,ci)=>{const st=k;let sum=0;c.i.forEach(()=>sum+=a[k++]);tot+=sum;const m=sum/c.i.length;rows+=`<tr class="ch"><td>${"ABCD"[ci]}. ${c.t}</td><td>${m.toFixed(5)}</td><td>${dsc(m)}</td></tr>`;c.i.forEach((x,i)=>rows+=`<tr><td class="it2">${esc(x)}</td><td>${a[st+i].toFixed(5)}</td><td>${dsc(a[st+i])}</td></tr>`)});
 const o=tot/N,cm=L.map(e=>e.c).filter(c=>c&&c.toLowerCase()!="none");
 return`<div class="blk"><h3>${ti||"Subject: "+esc(s)}</h3><p>${ti?"Evaluations (all subjects)":"Respondents"}: <b>${n}</b> · Overall mean: <b>${o.toFixed(5)}</b> (${dsc(o)})</p><div class="sc"><table><tr><th>Statement</th><th>Mean</th><th>Rating</th></tr>${rows}</table></div><h3 style="margin-top:12px">E. Comments (${cm.length})</h3>${cm.length?`<ul>${cm.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:'<p class="mu">None</p>'}<p class="note">Note: The comments presented in this section are the verbatim responses submitted by the respondents. For purposes of transparency and accurate representation of the feedback received, the comments have been reproduced in their original form without filtering, editing, modification, or alteration.</p>${sg!==undefined?sig(sg):""}</div>`}
function gen(){const t=D.teachers.find(x=>x.id==$("rt").value),s=$("rs").value;if(!t)return;
 const subs=s=="*"?[...new Set([...t.subjects,...D.evals.filter(e=>e.tid==t.id).map(e=>e.s)])]:[s],all=D.evals.filter(e=>e.tid==t.id&&subs.includes(e.s));
 $("rep").innerHTML=`<div class="blk"><div class="ph"><img class="lg2" src="${LOGO}" alt=""><div><b>City College of Davao</b><br>Faculty Evaluation Form</div></div><h2>Faculty Evaluation Report</h2><p><b>Teacher:</b> ${esc(t.name)}<br><b>Subject:</b> ${s=="*"?"All subjects":esc(s)}<br><b>Date generated:</b> ${new Date().toLocaleDateString()}<br><b>Total respondents:</b> ${all.length}${all.length?` · <b>Overall result (combined):</b> ${mean(all).toFixed(5)} (${dsc(mean(all))})`:""}</p>
 <p class="scale">Scale: 1 Poor · 2 Fair · 3 Satisfactory · 4 Very Satisfactory · 5 Outstanding</p></div>`+(s=="*"&&subs.length>1?`<div class="blk"><h3>Summary per subject</h3><table><tr><th>Subject</th><th>Respondents</th><th>Mean</th><th>Rating</th></tr>${subs.map(x=>{const L=all.filter(e=>e.s==x);return`<tr><td>${esc(x)}</td><td>${L.length}</td><td>${L.length?mean(L).toFixed(5):"–"}</td><td>${L.length?dsc(mean(L)):"–"}</td></tr>`}).join("")}</table></div>`:"")+(s=="*"?block("",all,"Combined Summary – All Subjects Evaluated (per questionnaire)",t.name):"")+subs.map(x=>block(x,all.filter(e=>e.s==x))).join("");S.fn=("Faculty-Evaluation-Report-"+t.name+(s=="*"?"":" "+s)).replace(/[^A-Za-z0-9]+/g,"-").slice(0,90);S.land=false}
$("lg").src=LOGO;(async()=>{if(TOK){try{await reload();S.v="admin"}catch(e){}}render()})();
</script></body></html>
